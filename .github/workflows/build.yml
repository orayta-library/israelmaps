name: Build Israel Maps App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        platform: [x64, ARM64]
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: msbuild IsraelMapsApp.csproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /restore

    - name: Publish
      run: msbuild IsraelMapsApp.csproj /t:Publish /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: IsraelMapsApp-${{ matrix.platform }}-${{ matrix.configuration }}
        path: bin/${{ matrix.platform }}/${{ matrix.configuration }}/net8.0-windows10.0.22621.0/publish/
        retention-days: 30

  create-release:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Download x64 artifact
      uses: actions/download-artifact@v4
      with:
        name: IsraelMapsApp-x64-Release
        path: ./release/x64

    - name: Download ARM64 artifact
      uses: actions/download-artifact@v4
      with:
        name: IsraelMapsApp-ARM64-Release
        path: ./release/ARM64

    - name: Create ZIP archives
      run: |
        Compress-Archive -Path ./release/x64/* -DestinationPath IsraelMapsApp-x64.zip
        Compress-Archive -Path ./release/ARM64/* -DestinationPath IsraelMapsApp-ARM64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          IsraelMapsApp-x64.zip
          IsraelMapsApp-ARM64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
