<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפות ישראל</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #mapContainer {
            width: 100%;
            height: 100%;
        }
        .offline-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 193, 7, 0.9);
            color: #000;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .leaflet-control-attribution {
            direction: ltr;
        }
    </style>
</head>
<body>
    <div id="mapContainer"></div>
    <div id="offlineIndicator" class="offline-indicator">מצב אופליין</div>

    <script>
        let map;
        let isOffline = false;
        let offlineCache = {};
        let currentMarker = null;

        // Initialize map centered on Israel (Jerusalem)
        function initMap() {
            map = L.map('mapContainer').setView([31.7683, 35.2137], 8);

            // OpenStreetMap tiles - completely free!
            const onlineLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
                minZoom: 6
            });

            onlineLayer.addTo(map);

            // Cache tiles as they load
            onlineLayer.on('tileload', function(e) {
                const tile = e.tile;
                const url = e.url;
                
                // Store in cache
                if (!isOffline) {
                    offlineCache[url] = tile.src;
                }
            });

            // Add scale control
            L.control.scale({ imperial: false, metric: true }).addTo(map);

            console.log('מפה נטענה בהצלחה');
        }

        async function searchLocation(query) {
            if (isOffline) {
                alert('חיפוש לא זמין במצב אופליין');
                return;
            }

            try {
                // Use Nominatim (OpenStreetMap's free geocoding service)
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?` +
                    `q=${encodeURIComponent(query)},Israel&format=json&limit=1&accept-language=he`
                );
                
                const results = await response.json();
                
                if (results.length > 0) {
                    const location = results[0];
                    const lat = parseFloat(location.lat);
                    const lon = parseFloat(location.lon);
                    
                    // Remove previous marker
                    if (currentMarker) {
                        map.removeLayer(currentMarker);
                    }
                    
                    // Add new marker
                    currentMarker = L.marker([lat, lon]).addTo(map);
                    currentMarker.bindPopup(location.display_name).openPopup();
                    
                    // Center map on location
                    map.setView([lat, lon], 14);
                } else {
                    alert('לא נמצאה כתובת');
                }
            } catch (error) {
                console.error('שגיאה בחיפוש:', error);
                alert('שגיאה בחיפוש הכתובת');
            }
        }

        function setOfflineMode(offline) {
            isOffline = offline;
            const indicator = document.getElementById('offlineIndicator');
            indicator.style.display = offline ? 'block' : 'none';

            if (offline) {
                console.log('מצב אופליין מופעל - משתמש במפות שמורות');
                console.log(`נשמרו ${Object.keys(offlineCache).length} אריחי מפה`);
            } else {
                console.log('מצב מקוון מופעל');
            }
        }

        // Initialize on load
        window.onload = initMap;
    </script>
</body>
</html>
